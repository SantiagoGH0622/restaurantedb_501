{% extends 'gestion/base.html' %}
{% block content %}
<h2>Confirmar eliminación</h2>
<p>¿Estás seguro de que deseas eliminar <strong>{{ objeto }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background:#8B0000;color:white;padding:8px 16px;border:none;border-radius:4px;cursor:pointer;">Sí, eliminar</button>
    <a href="{% url 'lista_mesas' %}" style="margin-left:12px;">Cancelar</a>
</form>
{% endblock %}
